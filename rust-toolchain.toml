# Curriculum targets Rust 1.95.0 (stable as of May 2026). Any 1.80+ stable will build everything.
# Pin a specific version once the team is ready to lock it down (e.g. `channel = "1.95.0"`).
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src"]
profile = "minimal"
