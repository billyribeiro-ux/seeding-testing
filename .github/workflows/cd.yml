name: CD

# Continuous Deployment — builds and ships container images for the capstone.
# Triggers:
#   - push to main      → publish :main (staging deploy)
#   - tag v*.*.*        → publish :vX.Y.Z + :latest (production deploy)
#   - workflow_dispatch → manual deploy of any ref to a chosen env

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "apps/memberclub/api/**"
      - "apps/memberclub/web/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # don't cancel a deploy mid-flight

permissions:
  contents: read
  packages: write             # publish to GitHub Container Registry
  id-token: write             # OIDC for cloud auth (Fly.io, AWS, GCP…)

env:
  REGISTRY:  ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/memberclub-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/memberclub-web

jobs:
  # -----------------------------------------------------------------
  # Build & publish the API container.
  # -----------------------------------------------------------------
  build-api:
    name: build-api (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: hashFiles('apps/memberclub/api/Dockerfile') != ''
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/memberclub/api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # -----------------------------------------------------------------
  # Build & publish the SvelteKit container.
  # -----------------------------------------------------------------
  build-web:
    name: build-web (sveltekit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: hashFiles('apps/memberclub/web/Dockerfile') != ''
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/memberclub/web
          file: apps/memberclub/web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # -----------------------------------------------------------------
  # DB migrations — run before the new app version starts taking traffic.
  # -----------------------------------------------------------------
  migrate:
    name: db migrate
    runs-on: ubuntu-latest
    needs: [build-api]
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sqlx-cli
        run: cargo install --locked sqlx-cli@0.8.6 --no-default-features --features postgres,rustls
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: sqlx migrate run --source apps/memberclub/db/migrations

  # -----------------------------------------------------------------
  # Deploy — example targets. Pick one (or several) at Phase 12.
  # All are gated by `environment:` so secrets and required reviewers
  # are enforced by the GitHub Environment settings.
  # -----------------------------------------------------------------
  deploy-api:
    name: deploy api
    runs-on: ubuntu-latest
    needs: [build-api, migrate]
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url:  ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      # Pick whichever provider you use. Example: Fly.io.
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config apps/memberclub/api/fly.toml \
            --image ${{ env.IMAGE_API }}@${{ needs.build-api.outputs.digest }} \
            --strategy rolling \
            --wait-timeout 180

  deploy-web:
    name: deploy web
    runs-on: ubuntu-latest
    needs: [build-web, deploy-api]
    timeout-minutes: 15
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url:  ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly deploy (web)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --config apps/memberclub/web/fly.toml \
            --image ${{ env.IMAGE_WEB }}@${{ needs.build-web.outputs.digest }} \
            --strategy rolling \
            --wait-timeout 180

  # -----------------------------------------------------------------
  # Post-deploy smoke test — verifies /health on the new version.
  # If this fails, the runbook in docs/runbooks/rollback.md tells you
  # how to roll back via `flyctl releases rollback`.
  # -----------------------------------------------------------------
  smoke:
    name: post-deploy smoke
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    timeout-minutes: 5
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    steps:
      - name: GET /health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS "${{ vars.API_URL }}/health" | grep -q '"status":"ok"'; then
              echo "API healthy"
              exit 0
            fi
            echo "Attempt $i: not yet healthy; waiting…"
            sleep 6
          done
          echo "::error::API /health failed after retries"
          exit 1
