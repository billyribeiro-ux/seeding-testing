name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0          # CI builds skip incremental compilation
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  SQLX_OFFLINE: "true"          # build against .sqlx/ cache, not a live DB

jobs:
  # -----------------------------------------------------------------
  # Cheap, fast checks first — fail early.
  # -----------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # -----------------------------------------------------------------
  # Tests — needs Postgres + Redis service containers from Phase 3 onward.
  # -----------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB:       app
          POSTGRES_USER:     app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      REDIS_URL:    redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }
      - name: Run tests
        run: cargo nextest run --workspace --all-features --no-fail-fast

  # -----------------------------------------------------------------
  # Coverage — produces an lcov.info artifact, no threshold gate.
  # Advisory only: not part of the ci-passed required-checks list.
  # -----------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - name: Generate lcov
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  # -----------------------------------------------------------------
  # Supply-chain & security checks (run on every PR).
  # -----------------------------------------------------------------
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The action defaults `arguments` to `--all-features`, which is not a
          # valid flag for `cargo deny check`. Feature handling lives in
          # deny.toml (`[graph] all-features = true`), so pass no extra args.
          arguments: ""

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------
  # SvelteKit projects. Matrix over every package.json under projects/
  # and apps/. Each entry runs install + check + test + build.
  # -----------------------------------------------------------------
  web:
    name: web — ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - projects/02b-sqlite-notes-svelte
          - projects/09-svelte-counter
          - apps/memberclub/web
    if: hashFiles(format('{0}/package.json', matrix.dir)) != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.dir }}
      - run: pnpm check
        working-directory: ${{ matrix.dir }}
      - run: pnpm test
        working-directory: ${{ matrix.dir }}
      - run: pnpm build
        working-directory: ${{ matrix.dir }}

  # -----------------------------------------------------------------
  # Single required check downstream of all of the above — branch
  # protection should require *this* job, so adding new sub-jobs
  # never requires re-configuring the rule.
  # -----------------------------------------------------------------
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, deny, audit]
    if: always()
    steps:
      - name: All required checks succeeded
        run: |
          if [[ "${{ needs.fmt.result }}"    != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}"   != "success" ]] || \
             [[ "${{ needs.deny.result }}"   != "success" ]] || \
             [[ "${{ needs.audit.result }}"  != "success" ]]; then
            echo "::error::One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed."
