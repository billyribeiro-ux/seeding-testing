[package]
name        = "memberclub-api"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "MemberClub integration service — Axum + sqlx + argon2 + RBAC/ABAC. Combines patterns from notes-api, auth-demo, and rbac-policy-lab into one self-contained Rust service."

[[bin]]
name = "memberclub-api"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum        = { workspace = true, features = ["macros"] }
axum-extra  = { version = "0.10", features = ["cookie-signed"] }
tower       = { workspace = true }
tower-http  = { workspace = true }
http        = "1"
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
sqlx        = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
argon2      = "0.5"
rand        = { workspace = true }
sha2        = "0.10"
hex         = "0.4"
jsonwebtoken = "9"
chrono      = { workspace = true }
base64      = "0.22"
time        = "0.3"
metrics    = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
