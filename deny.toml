# cargo-deny configuration. Tightens licenses, advisories, banned crates.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
db-path           = "~/.cargo/advisory-db"
db-urls           = ["https://github.com/rustsec/advisory-db"]
ignore            = []                         # add RUSTSEC-IDs here only with a written rationale + expiry
yanked            = "warn"

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
    # Avoid Tokio v0.x (legacy)
    { name = "tokio", version = "<1.0" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
