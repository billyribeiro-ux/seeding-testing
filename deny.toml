# cargo-deny configuration. Tightens licenses, advisories, banned crates.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
db-path           = "~/.cargo/advisory-db"
db-urls           = ["https://github.com/rustsec/advisory-db"]
ignore            = [
    # rsa 0.9 — RUSTSEC-2023-0071 (Marvin attack: a non-constant-time
    # implementation leaks private-key bits through decryption timing that an
    # attacker can observe over the network). No fixed release exists yet (see
    # RustCrypto/RSA#626). It reaches us directly via the RS256 JWT lab in
    # auth-demo and transitively via totp-rs. This curriculum only uses rsa
    # for JWT RS256 sign/verify and TOTP — never as a network-reachable
    # decryption oracle — so the practical exposure is low. Drop this entry
    # once a constant-time rsa release ships.
    { id = "RUSTSEC-2023-0071", reason = "no fix available; rsa is used only for RS256 JWT sign/verify + TOTP, not a network decryption oracle. Revisit by 2026-09-01." },
]
yanked            = "warn"
# Newer cargo-deny derives vulnerability/unmaintained behavior from the
# advisory severity rather than explicit knobs, but documenting the
# intent here keeps reviewers honest: vulnerabilities should fail the
# build, unmaintained should at least warn. If we suppress a finding,
# the suppression goes in `ignore` above with rationale + expiry.

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    # webpki-roots ships Mozilla's CA bundle under the Community Data License
    # Agreement (a permissive *data* license); pulled in transitively by
    # sqlx-core and hyper-rustls.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# GPL-family licenses are intentionally NOT in the allowlist. Any
# transitive dep that pulls in GPL-2.0 / GPL-3.0 / AGPL-3.0 / LGPL
# would taint the dual MIT/Apache-2.0 licensing of the workspace, so
# the absence here causes the build to fail and forces the discussion.
# See docs/security/03-supply-chain.md for the rationale.

[bans]
multiple-versions = "warn"
wildcards         = "deny"
# Intra-workspace crates are depended on by `path` with no version, which
# cargo-deny would otherwise flag as a wildcard. Those are first-party and
# safe; only *registry* wildcard deps (`foo = "*"`) are the foot-gun we deny.
allow-wildcard-paths = true
deny = [
    # Avoid Tokio v0.x (legacy)
    { name = "tokio", version = "<1.0" },
]
# Crypto duplicate-version foot-guns. Two TLS/crypto stacks loaded into
# the same process is the classic source of "which entropy pool did I
# use?" bugs. Calling these out here lets us escalate to `deny` if the
# workspace ever resolves to two versions of any of them. See the
# duplicate-version warning above; if it fires on one of these, treat
# it as a build failure pending investigation.
skip-tree = []
# When we move from warn → deny, list the crates here as
# `{ crate = "openssl" }` etc. and re-run `cargo deny check`.

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
