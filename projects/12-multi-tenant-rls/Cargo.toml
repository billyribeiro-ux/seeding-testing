[package]
name        = "multi-tenant-rls"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 11 lab — multi-tenant Postgres with row-level security. Pure-Rust policy layer that emits the SQL to enforce tenant isolation, with proptests over the policy's belt-and-braces property: rows are NEVER visible across tenants, no matter the input."

[lib]
path = "src/lib.rs"

[dependencies]
anyhow    = { workspace = true }
thiserror = { workspace = true }
serde     = { workspace = true }
uuid      = { workspace = true }
chrono    = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
