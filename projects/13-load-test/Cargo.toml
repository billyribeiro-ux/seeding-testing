[package]
name        = "load-test"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 11 load-test harness. A tiny `loadgen` binary that drives concurrent HTTP requests against a target URL with a per-second cap, emits per-route p50/p95/p99 + status-class counts, and writes a CSV report that pairs with the perf-retrospective template."

[[bin]]
name = "loadgen"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow    = { workspace = true }
thiserror = { workspace = true }
tokio     = { workspace = true }
reqwest   = { workspace = true }
clap      = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
tracing   = { workspace = true }
tracing-subscriber = { workspace = true }
futures   = { workspace = true }
humantime = { workspace = true }
chrono    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
cast_possible_truncation = "allow"
cast_sign_loss          = "allow"
cast_precision_loss     = "allow"
