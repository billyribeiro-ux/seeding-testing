[package]
name        = "notes-api"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 4 capstone — a real Axum CRUD service over the sqlx-notes data layer. Demonstrates routing, extractors, problem-details errors, and middleware."

[[bin]]
name = "notes-api"
path = "src/main.rs"

[[bin]]
name = "notes-seed"
path = "src/bin/notes-seed.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum       = { workspace = true }
tower      = { workspace = true }
tower-http = { workspace = true }
http       = "1"
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
fake       = { workspace = true }
rand       = { workspace = true }
sqlx       = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
chrono     = { workspace = true }
uuid       = { workspace = true }
sqlx-notes = { path = "../02c-sqlx-notes" }
metrics    = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
