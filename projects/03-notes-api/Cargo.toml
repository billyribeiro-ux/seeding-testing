[package]
name        = "notes-api"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
publish     = false   # curriculum application, never published to crates.io
description = "Phase 4 capstone — a real Axum CRUD service over the sqlx-notes data layer. Demonstrates routing, extractors, problem-details errors, and middleware."

[[bin]]
name = "notes-api"
path = "src/main.rs"

[[bin]]
name = "notes-seed"
path = "src/bin/notes-seed.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum       = { workspace = true }
tower      = { workspace = true }
tower-http = { workspace = true }
http       = "1"
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
fake       = { workspace = true }
rand       = { workspace = true }
sqlx       = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
chrono     = { workspace = true }
uuid       = { workspace = true }
sqlx-notes = { path = "../02c-sqlx-notes" }
metrics    = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
base64     = "0.22"
utoipa     = { version = "5", features = ["axum_extras", "chrono"] }

# OpenTelemetry / OTLP tracing.
# Pin set chosen for the May 2026 stack:
#   opentelemetry 0.27.x + opentelemetry_sdk 0.27.x + opentelemetry-otlp 0.27.x
#   tracing-opentelemetry 0.28.x (the last release that pairs with opentelemetry 0.27).
# The OTel Rust crates do a coordinated semver bump every few months and
# tracing-opentelemetry trails by one minor — keep these four crates moving as
# a unit when bumping. Newer 0.28+ lines exist but exercise the new SpanExporterBuilder
# API; the 0.27 line is still the most-deployed pin across the Rust OTel ecosystem.
opentelemetry        = { version = "0.27", features = ["trace"] }
opentelemetry_sdk    = { version = "0.27", features = ["rt-tokio", "trace"] }
opentelemetry-otlp   = { version = "0.27", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.28"

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
insta = { workspace = true, features = ["json"] }
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
# `doc_markdown` flags "OTel", "OTLP", "RAII", etc. as unticked items.
# The telemetry module's docs read better as prose; ticking every
# acronym hurts readability more than it helps.
doc_markdown            = "allow"
