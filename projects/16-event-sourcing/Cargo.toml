[package]
name = "event-sourcing"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Phase 11 stretch lab — a teachable event-sourcing kernel + CQRS read model. A `BankAccount` aggregate, a SQLite-backed `EventStore` with optimistic concurrency via a UNIQUE(stream_id, version) index, and a polling `BalanceProjection` that demonstrates the command/read-model split."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }
async-trait  = "0.1"
sqlx         = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros"] }
tokio-stream = "0.1"
futures      = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
doc_lazy_continuation   = "allow"
cast_possible_truncation = "allow"
cast_sign_loss          = "allow"
cast_possible_wrap      = "allow"
