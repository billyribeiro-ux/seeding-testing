[package]
name        = "webhook-receiver"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 8 capstone 2 — receive Stripe-style signed webhooks. Verifies HMAC-SHA-256 signatures, stores events idempotently (UNIQUE on event id), and proves replay-safety with integration tests."

[[bin]]
name = "webhook-receiver"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum       = { workspace = true }
tower      = { workspace = true }
tower-http = { workspace = true }
http       = "1"
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
sqlx       = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
chrono     = { workspace = true }
hmac       = "0.12"
sha2       = "0.10"
hex        = "0.4"

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
redundant_closure_for_method_calls = "allow"
cast_possible_truncation = "allow"
cast_sign_loss          = "allow"
cast_possible_wrap      = "allow"
