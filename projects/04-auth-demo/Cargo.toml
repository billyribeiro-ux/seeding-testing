[package]
name        = "auth-demo"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 6 capstone — Axum auth service demonstrating the enterprise dual-mode pattern: signed HttpOnly session cookies for browsers + RS256 JWT access tokens for API clients. Includes argon2id password hashing and an AuthenticatedUser extractor that accepts either transport."

[[bin]]
name = "auth-demo"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum        = { workspace = true, features = ["macros"] }
axum-extra  = { version = "0.10", features = ["cookie-signed", "typed-header"] }
tower       = { workspace = true }
tower-http  = { workspace = true }
http        = "1"
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
sqlx        = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
argon2      = "0.5"
rand        = { workspace = true }
sha2        = "0.10"
hex         = "0.4"
jsonwebtoken = "9"
chrono      = { workspace = true }
base64      = "0.22"
time        = "0.3"
totp-rs     = { version = "5", default-features = false, features = ["otpauth"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
governor    = "0.10"
rsa         = { version = "0.9", default-features = false, features = ["std", "pem", "getrandom"] }
reqwest     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
