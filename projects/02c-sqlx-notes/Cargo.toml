[package]
name        = "sqlx-notes"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 3 Step B — the same notes domain, this time with sqlx + SQLite. Demonstrates compile-time-checked SQL, migrations, and integration tests."

[lib]
path = "src/lib.rs"

[dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate", "chrono"] }
thiserror = { workspace = true }
anyhow    = { workspace = true }
tokio     = { workspace = true }
chrono    = { workspace = true }
# Powers `sqlx_notes::factory::note()` (Phase 5 — E5.4). `fake` is a
# small dep with no proc-macro footprint, so we keep it in the default
# build rather than hiding it behind a feature flag.
fake      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
