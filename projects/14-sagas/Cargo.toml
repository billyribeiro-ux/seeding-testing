[package]
name = "sagas"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "Phase 11 lab — saga orchestrator with compensating transactions. A `Saga` runs a list of `Step`s; on any failure it runs `compensate` on every prior successful step in LIFO order. Worked example: a MemberClub `upgrade_subscription` saga across charge / DB row / email."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
async-trait = "0.1"
rand        = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
doc_markdown            = "allow"
doc_lazy_continuation   = "allow"
cast_possible_truncation = "allow"
cast_sign_loss          = "allow"
cast_possible_wrap      = "allow"
