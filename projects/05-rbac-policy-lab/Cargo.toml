[package]
name        = "rbac-policy-lab"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Phase 7 capstone — RBAC + ABAC policy library. Pure functions over (subject, action, resource, ctx) with builder-based test factories. No HTTP — the focus is policy design and the test suite as a security spec."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
chrono    = { workspace = true }
serde     = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
